aid: falconx
name: FalconX
description: 'FalconX is an institutional digital-asset prime brokerage that provides
  trading, credit and financing, custody, and market-access services to banks, asset
  managers, hedge funds, and other financial institutions. The platform offers spot,
  derivatives, options, and FX execution across 400+ tokens via an OTC desk, an
  execution-management system, and direct market access (DMA) with cross-margining
  and one-click borrowing, alongside margin loans, structured products, staking, and
  ETF liquidity provision. FalconX exposes a REST trading API (api.falconx.io) for
  price quotes, order execution, trade history, balances, transfers, and trade limits,
  documented publicly on a Stoplight developer portal and monitored via an Atlassian
  status page. FalconX entities are regulated as a CFTC-registered swap dealer and a
  Malta MFSA crypto-asset service provider.'
